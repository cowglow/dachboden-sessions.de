name: Update Website

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Only one Pages deployment at a time; let an in-progress one finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Build and Deploy Update
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install Dependencies 📦
        run: yarn install --frozen-lockfile

      - name: Build 🚧
        run: yarn build

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - name: Deploy 🚀
        id: deployment
        uses: actions/deploy-pages@v4
